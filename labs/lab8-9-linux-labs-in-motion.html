<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Linux Labs in Motion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one projector screen. Timeline on top, question, terminal beside a live view of the system, narration underneath. */
:root{
  --bg:#ECE8F1; --panel:#F9F7FB; --sunk:#E2DCE9; --fg:#2A1730; --muted:#67566F; --line:#CFC6D8;
  --accent:#C8420F; --ok:#1B7A4B; --bad:#BC2838; --warn:#8A5C00; --warn-bg:#F7E9C8; --on-accent:#FFFFFF;
  --sans:"Ubuntu","Segoe UI",system-ui,sans-serif; --mono:"Ubuntu Mono","DejaVu Sans Mono",Consolas,monospace;
  /* The terminal keeps the Ubuntu look in both themes. */
  --t-bg:#300A24; --t-bar:#3D3540; --t-fg:#EEEAEC; --t-dim:#B9A9B5; --t-green:#8AE234; --t-blue:#8FB8E6; --t-red:#FF6B6B; --t-yellow:#FCE94F; --t-inv-bg:#EEEAEC; --t-inv-fg:#300A24;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0F1F;--panel:#26172C;--sunk:#352340;--fg:#F2EBF4;--muted:#B7A8BF;--line:#47344F;--accent:#FF8148;--ok:#58D096;--bad:#FF8590;--warn:#F2C14E;--warn-bg:#42330F;--on-accent:#26120A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A0F1F;--panel:#26172C;--sunk:#352340;--fg:#F2EBF4;--muted:#B7A8BF;--line:#47344F;--accent:#FF8148;--ok:#58D096;--bad:#FF8590;--warn:#F2C14E;--warn-bg:#42330F;--on-accent:#26120A;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:1680px;margin:0 auto;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl button,.ctl select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;min-height:32px}
.ctl button:hover{border-color:var(--accent)}
.ctl #play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500;min-width:78px}
.ctl label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);padding:0 4px;cursor:pointer}

.rail{display:flex;gap:18px;overflow-x:auto;padding-bottom:2px}
.grp{flex:1 0 auto;min-width:0}
.grp h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:500}
.ticks{display:flex;gap:4px}
.tick{flex:1 1 0;background:none;border:0;border-top:4px solid var(--line);padding:4px 2px 0;font-size:13px;color:var(--muted);text-align:left;white-space:nowrap;cursor:pointer;position:relative;min-width:72px}
.tick::before{content:"";position:absolute;left:0;top:-4px;height:4px;width:calc(var(--p,0)*100%);background:var(--accent);transition:width .25s}
.tick.on{color:var(--fg);font-weight:500}

.ask{min-height:78px}
.eyebrow{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow b{color:var(--accent);font-weight:500}
.extra{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:3px;padding:0 6px}
h1{font-size:clamp(21px,2.5vw,32px);line-height:1.18;margin:2px 0 0;font-weight:500;letter-spacing:-.015em;text-wrap:balance}
h1.pulse{animation:pulse .6s}
@keyframes pulse{from{color:var(--accent)}}

.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;min-height:0}
.term{background:var(--t-bg);color:var(--t-fg);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative;font-family:var(--mono);font-size:clamp(14px,1.15vw,17px);line-height:1.25}
.tbar{background:var(--t-bar);height:30px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:13px;color:var(--t-fg);position:relative}
.tbar i{position:absolute;right:10px;width:12px;height:12px;border-radius:50%;background:#E95420}
.tbar i:nth-child(2){right:28px;background:#7A7079}.tbar i:nth-child(3){right:46px;background:#7A7079}
.tbody{flex:1;overflow-y:auto;padding:10px 12px;min-height:0;position:relative}
.l{white-space:pre-wrap;word-break:break-word;min-height:1.25em}
.g{color:var(--t-green);font-weight:700}.b{color:var(--t-blue);font-weight:700}.r{color:var(--t-red)}.y{color:var(--t-yellow)}.d{color:var(--t-dim)}
.hl{background:var(--t-yellow);color:var(--t-inv-fg);padding:0 2px;border-radius:2px}
.cur{display:inline-block;width:.55em;height:1em;background:var(--t-fg);vertical-align:text-bottom;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.screen{position:absolute;inset:30px 0 0;background:var(--t-bg);display:flex;flex-direction:column;padding:6px 8px;overflow:auto}
.nb{display:flex;justify-content:space-between;background:var(--t-inv-bg);color:var(--t-inv-fg);padding:0 6px;gap:12px}
.nt{flex:1;padding:4px 2px;min-height:0;overflow:auto}
.nt .new{color:var(--t-yellow)}
.ns{min-height:1.3em;text-align:center}
.ns span{background:var(--t-inv-bg);color:var(--t-inv-fg);padding:0 6px}
.nk{display:grid;grid-template-columns:repeat(4,1fr);font-size:.88em;color:var(--t-dim)}
.nk b{background:var(--t-inv-bg);color:var(--t-inv-fg);font-weight:400;padding:0 2px;margin-right:4px}
.toptxt{white-space:pre;margin:0;font:inherit;min-width:max-content}
.toptxt .hot{background:var(--t-red);color:var(--t-inv-fg)}
.key{position:absolute;right:16px;bottom:14px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;font-family:var(--sans);font-size:18px;font-weight:500;padding:6px 14px;z-index:5}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
.shot{position:absolute;left:12px;bottom:12px;background:var(--panel);color:var(--fg);border-radius:5px;font-family:var(--sans);font-size:13px;padding:4px 10px;z-index:5;font-weight:500}

.viz{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;min-width:0}
.vt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.vb{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.m{font-family:var(--mono)}
.sm{font-size:13px;color:var(--muted)}

.narr{display:flex;gap:14px;align-items:flex-start;min-height:56px;flex-wrap:wrap}
#cap{flex:1 1 380px;font-size:clamp(15px,1.3vw,18px);max-width:88ch;min-width:0}
#cap code,.note code{font-family:var(--mono);font-size:1.02em;background:var(--sunk);padding:0 4px;border-radius:3px}
.note{flex:0 1 460px;background:var(--warn-bg);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:14px;min-width:0}
.note b{color:var(--warn)}

/* scene pieces */
.tape{display:flex;gap:12px;flex:1;min-height:150px}
.strip{position:relative;width:96px;flex:none;display:flex;flex-direction:column;justify-content:space-between;background:var(--sunk);border-radius:4px;padding:6px;overflow:hidden}
.strip i{display:block;height:3px;background:var(--muted);opacity:.45;border-radius:1px;transition:background .3s,opacity .3s}
.strip i.err{background:var(--bad);opacity:1;height:4px}
.win{position:absolute;left:0;right:0;bottom:0;height:100%;border:2px solid var(--accent);border-radius:4px;transition:height 1s}
.finds{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.find{background:var(--sunk);border-radius:5px;padding:6px 9px;font-size:14px}
.find b{color:var(--bad);font-weight:500;display:block}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 54px;align-items:center;gap:8px;font-size:14px}
.row .bar{height:16px;background:var(--sunk);border-radius:3px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--muted);width:0;transition:width .45s}
.row.hot .bar i{background:var(--bad)}.row.hot{color:var(--bad);font-weight:500}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.layers{display:flex;flex-direction:column;gap:6px;position:relative}
.layer{background:var(--sunk);border-radius:5px;padding:7px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;transition:background .3s,color .3s}
.layer.on{background:var(--accent);color:var(--on-accent)}
.layer.fail{background:var(--bad);color:var(--panel)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:3px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);word-break:break-word}
.stagecard{border:1px solid var(--line);border-radius:6px;padding:8px 10px;transition:border-color .3s}
.stagecard.on{border-color:var(--accent)}
.stagecard.done{border-color:var(--ok)}
.stagecard h3{margin:0;font-size:15px;font-family:var(--mono)}
.gate{align-self:center;font-family:var(--mono);font-size:18px;padding:1px 14px;border-radius:14px;background:var(--sunk);color:var(--muted);transition:all .3s}
.gate.ok{background:var(--ok);color:var(--panel)}
.pk{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:13px;gap:2px 8px;margin-top:6px}
.pk .m{transition:color .3s}.pk .new{color:var(--ok)}
.track{display:flex;gap:4px;flex-wrap:wrap}
.track span{flex:1 1 70px;text-align:center;background:var(--sunk);padding:7px 2px;border-radius:4px;font-size:13px;transition:background .3s,color .3s}
.track span.on{background:var(--accent);color:var(--on-accent)}
.track span.done{background:var(--ok);color:var(--panel)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp div{background:var(--sunk);border-radius:6px;padding:10px}
.cmp .big.bad{color:var(--bad)}.cmp .big.ok{color:var(--ok)}
.pw{font-family:var(--mono);font-size:21px;background:var(--sunk);padding:6px 10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-family:var(--sans);font-size:13px;color:var(--muted)}
.gates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.gt{background:var(--sunk);border-radius:5px;padding:7px 3px;text-align:center;font-size:13px;transition:background .25s,color .25s,opacity .3s}
.gt code{display:block;font-family:var(--mono);font-size:12px;opacity:.85;word-break:break-word}
.gt.ok{background:var(--ok);color:var(--panel)}.gt.bad{background:var(--bad);color:var(--panel)}.gt.off{opacity:.4}
.verdict{font-weight:500;font-size:16px;min-height:1.4em}
.verdict.bad{color:var(--bad)}.verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:13px;transition:background .25s,color .25s;font-variant-numeric:tabular-nums}
.dots i.f{background:var(--warn);color:var(--panel)}.dots i.x{background:var(--bad);color:var(--panel)}
.lock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sw{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sw b{font-family:var(--mono);font-weight:700}
.tg{height:26px;background:var(--sunk);border-radius:13px;position:relative;transition:background .3s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .3s,background .3s}
.tg.on{background:var(--ok)}.tg.on::after{left:31px;background:var(--panel)}
.anat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:14px}
.anat code{font-family:var(--mono);font-weight:700}
.file{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--sunk);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:14px;flex-wrap:wrap;transition:outline-color .3s;outline:2px solid transparent}
.file.hit{outline-color:var(--accent)}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent);color:var(--on-accent);opacity:0;transition:opacity .35s;font-family:var(--mono)}
.pill.on{opacity:1}
.state{font-size:13px;color:var(--muted)}.state.ok{color:var(--ok);font-weight:500}
.log{display:flex;flex-direction:column;gap:3px}
.ent{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:13px;background:var(--sunk);padding:4px 8px;border-radius:3px;transition:opacity .3s,outline-color .3s;outline:2px solid transparent}
.ent.dim{opacity:.28}.ent.hit{outline-color:var(--accent)}
.ent span:last-child{color:var(--muted);white-space:nowrap}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;grid-template-rows:none}
  .stage{grid-template-columns:minmax(0,1fr)}
  .term{height:380px}
  .viz{min-height:320px}
  .ask{min-height:0}
  .gates{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<div class="app">

<script>
const $=(s,r=document)=>r.querySelector(s);
const ABORT={};let token=0,paused=false,speed=1,cur=0,done=false;
const instant=matchMedia('(prefers-reduced-motion:reduce)').matches;
async function wait(ms){const t=token;
  if(instant){await null;if(t!==token)throw ABORT;return}
  let left=ms,last=performance.now();
  while(left>0||paused){
    await new Promise(r=>setTimeout(r,paused?60:Math.min(Math.max(left,1)/speed,40)));
    if(t!==token)throw ABORT;
    const n=performance.now();if(!paused)left-=(n-last)*speed;last=n;
  }}
function setPaused(p){paused=p;$('#play').textContent=done&&p?'Replay all':p?'Play':'Pause'}
async function gate(ms=3000){if($('#stopq').checked&&!instant){setPaused(true);await wait(1)}else await wait(ms)}

const T={el:$('#tb'),user:'student',
  ps(){return this.user==='root'?'root@ubuntu:~# ':'<span class="g">student@ubuntu</span>:<span class="b">~</span>$ '},
  add(h,c){const d=document.createElement('div');d.className='l '+(c||'');d.innerHTML=h;this.el.append(d);this.el.scrollTop=this.el.scrollHeight;return d},
  clear(){this.el.innerHTML=''},
  drop(){const c=$('.idle',this.el);if(c)c.remove()},
  idle(){this.drop();this.add(this.ps()+'<span class="cur"></span>','idle')},
  async cmd(x,ms=34){this.drop();const l=this.add(this.ps()+'<span class="t"></span><span class="cur"></span>');const t=$('.t',l);
    if(instant)t.textContent=x;else for(const c of x){t.textContent+=c;await wait(ms);this.el.scrollTop=this.el.scrollHeight}
    await wait(260);$('.cur',l).remove()},
  async out(a,g=110){for(const x of a){this.add(x);await wait(g)}},
  async su(){await this.cmd('su -');this.add('Password: ');await wait(650);this.user='root';$('#ttl').textContent='root@ubuntu: ~';this.idle()},
  async sudoPw(){this.add('[sudo] password for student: ');await wait(650)}
};
const scr=$('#scr');
const Nano={
  open(p,lines){scr.hidden=false;scr.innerHTML=`<div class="nb"><span>GNU nano 4.8</span><span>${p}</span><span></span></div><div class="nt"></div><div class="ns"></div><div class="nk">${[['^G','Get Help'],['^O','Write Out'],['^W','Where Is'],['^K','Cut Text'],['^X','Exit'],['^R','Read File'],['^\\','Replace'],['^U','Paste Text']].map(k=>`<span><b>${k[0]}</b>${k[1]}</span>`).join('')}</div>`;
    this.t=$('.nt',scr);lines.forEach(x=>this.line(x))},
  line(x,at){const d=document.createElement('div');d.className='l';d.textContent=x;at==null?this.t.append(d):this.t.insertBefore(d,this.t.children[at]);return d},
  async write(d,x){d.className='l new';d.innerHTML='<span class="t"></span><span class="cur"></span>';const t=$('.t',d);
    if(instant)t.textContent=x;else for(const c of x){t.textContent+=c;await wait(22)}$('.cur',d).remove()},
  async insert(at,x){await this.write(this.line('',at),x)},
  async replace(at,x){await this.write(this.t.children[at],x)},
  async save(p,n){const s=$('.ns',scr);await key('Ctrl + O');s.innerHTML=`<span>File Name to Write: ${p}</span>`;await wait(800);await key('Enter');s.innerHTML=`<span>[ Wrote ${n} lines ]</span>`;await wait(900);await key('Ctrl + X');scr.hidden=true;scr.innerHTML='';T.idle()}
};
async function key(k){const e=$('#key');e.textContent=k;e.hidden=false;await wait(760);e.hidden=true;await wait(120)}
async function shot(){const f=$('#flash'),s=$('#shot');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');s.hidden=false;await wait(1500);s.hidden=true}
function cap(h){$('#cap').innerHTML=h}
function note(h){const n=$('#note');n.hidden=!h;n.innerHTML=h?'<b>Lab note.</b> '+h:''}
function step(s){$('#stepn').textContent=s}
function extra(on){$('#extra').hidden=!on}
function ask(q){const h=$('#q');h.textContent=q;h.classList.remove('pulse');void h.offsetWidth;h.classList.add('pulse')}
const V=()=>$('#v');

const OS=(a)=>a;
const scenes=[

init(){const F=[['/var/log/auth.log','auth_log'],['/etc/passwd','passwd_changes'],['/etc/group','group_changes']];V().innerHTML=`<div class="anat"><code>-w</code><span>watch this path</span><code>-p wa</code><span>on <b>w</b>rite or <b>a</b>ttribute change</span><code>-k</code><span>label matching events with this key</span></div><div style="display:flex;flex-direction:column;gap:6px">${F.map((f,i)=>`<div class="file" id="f${i}"><span>${f[0]}</span><span class="pill" id="pl${i}">${f[1]}</span></div>`).join('')}</div><div class="state" id="st">Rules are in the file only. The kernel has not loaded them yet.</div>`},
b:[async()=>{cap('The login record, the list of accounts and the list of groups. Change any of these and you change who can do what.');await gate()},
async()=>{step('Step 1');cap('Open the rules file.');await T.cmd('sudo nano /etc/audit/rules.d/audit.rules');Nano.open('/etc/audit/rules.d/audit.rules',['## First rule - delete all','-D','','## Increase the buffers to survive stress events.','-b 8192','','## Set failure mode to syslog','-f 1','']);await wait(900)},
async()=>{step('Step 2');cap('Add one rule per file. The key is the label you search for later.');const R=['-w /var/log/auth.log -p wa -k auth_log','-w /etc/passwd -p wa -k passwd_changes','-w /etc/group -p wa -k group_changes'];for(let i=0;i<3;i++){$('#f'+i).classList.add('hit');await Nano.insert(8+i,R[i]);$('#pl'+i).classList.add('on');await wait(500);$('#f'+i).classList.remove('hit')}await wait(700)},
async()=>{step('Step 3');cap('Save and exit.');await Nano.save('/etc/audit/rules.d/audit.rules',12)},
async()=>{step('Step 4');cap('Rules in a file do nothing until they are loaded. Restarting auditd loads them into the kernel.');await T.cmd('sudo systemctl restart auditd');T.idle();await wait(800);const s=$('#st');s.textContent='3 rules loaded in the kernel and active';s.classList.add('ok');await wait(2800)}]},

{lab:9,nm:'Search',task:'Task 4',q:'The audit log holds thousands of events. How do you pull out only the ones you care about?',vt:'/var/log/audit/audit.log',

async()=>{cap('Same search, other key. Read the record type carefully.');await T.cmd('sudo ausearch -k passwd_changes');window.__f('passwd_changes');await T.out(['----','time-&gt;Sun Nov  8 12:29:40 2026','type=<span class="hl">CONFIG_CHANGE</span> msg=audit(1794126580.117:96): auid=4294967295 op=add_rule key="passwd_changes" list=4 res=1'],200);T.idle();await wait(1400);

/* rail */
scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='tick';b.textContent=s.nm;b.onclick=()=>go(i);s.btn=b;$('#r'+s.lab).append(b)});
function paint(i,p){scenes.forEach((s,k)=>{s.btn.classList.toggle('on',k===i);s.btn.style.setProperty('--p',k<i?1:k===i?p:0)})}
function reset(s){scr.hidden=true;scr.innerHTML='';scr.style.background='';$('#key').hidden=true;$('#shot').hidden=true;T.clear();T.user='student';$('#ttl').textContent='student@ubuntu: ~';T.idle();cap('');note('');step('');extra(false);$('#vt').textContent=s.vt;$('#where').textContent=`Lab ${s.lab} · ${s.task}`;$('#q').textContent=s.q;s.init()}
async function run(i){cur=i;done=false;const s=scenes[i];reset(s);paint(i,0);
  try{for(let b=0;b<s.b.length;b++){await s.b[b]();paint(i,(b+1)/s.b.length)}
    if(instant){setPaused(true);return}
    await wait(1800);
    if(i<scenes.length-1)run(i+1);else{done=true;setPaused(true)}
  }catch(e){if(e!==ABORT)throw e}}
function go(i){token++;i=Math.max(0,Math.min(scenes.length-1,i));if(!instant)setPaused(false);run(i)}

$('#play').onclick=()=>{if(done){done=false;go(0)}else setPaused(!paused)};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);$('#again').onclick=()=>go(cur);
$('#speed').onchange=e=>speed=+e.target.value;
$('#fs').onclick=()=>{const d=document;(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen()).catch(()=>{})};
addEventListener('keydown',e=>{if(/SELECT|INPUT/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();$('#play').click()}else if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='r')go(cur)});
if(location.hash.startsWith('#s')){const n=parseInt(location.hash.slice(2));if(n>=1&&n<=scenes.length)cur=n-1}
if(instant)setPaused(true);
run(cur);
</script>
