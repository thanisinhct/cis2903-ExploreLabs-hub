<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Linux Users &amp; Account Files</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one stage that changes scene by scene; the three user types keep the slide's colours (green admin, peach normal, blue system) on every scene */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --line:#d5dbe6; --fg:#1c2230; --muted:#5b6578;
  --accent:#1d4ed8; --accent-soft:#e3eafc;
  --root:#2f7a2a; --root-soft:#dcefd2; --norm:#b5631a; --norm-soft:#fde7cf; --sys:#1f62b5; --sys-soft:#d6e8fb; --core:#b3264f; --core-soft:#fbdbe4;
  --ok:#16733a; --ok-soft:#dff3e4; --no:#b4262b; --no-soft:#fbe3e3;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171d29; --line:#2a3344; --fg:#e4e8f0; --muted:#97a1b4;
  --accent:#7aa2ff; --accent-soft:#1d2a47;
  --root:#8fd27f; --root-soft:#1d3319; --norm:#f2a560; --norm-soft:#3b2914; --sys:#82b6f2; --sys-soft:#162a42; --core:#f28aa8; --core-soft:#3d1a26;
  --ok:#7fdc9c; --ok-soft:#163322; --no:#f49a9a; --no-soft:#3a1a1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171d29; --line:#2a3344; --fg:#e4e8f0; --muted:#97a1b4;
  --accent:#7aa2ff; --accent-soft:#1d2a47;
  --root:#8fd27f; --root-soft:#1d3319; --norm:#f2a560; --norm-soft:#3b2914; --sys:#82b6f2; --sys-soft:#162a42; --core:#f28aa8; --core-soft:#3d1a26;
  --ok:#7fdc9c; --ok-soft:#163322; --no:#f49a9a; --no-soft:#3a1a1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:70ch}
code,.mono{font-family:var(--mono)}
code{font-size:.92em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:disabled{opacity:.45;cursor:default}
.counter{font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-size:12.5px;padding:5px 10px}
.tab.now{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,3vw,32px) 28px;min-height:540px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stage h2{font-family:var(--display);font-size:clamp(26px,3.4vw,34px);margin:2px 0 0;line-height:1.1;text-wrap:balance}
.lead{margin:0;max-width:70ch;color:var(--muted)}
.remember{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;font-weight:500;max-width:74ch}
.remember b{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--accent)}
.in{animation:rise .5s both;animation-delay:calc(var(--i,0)*140ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll{overflow-x:auto;padding-bottom:4px}

/* scene 1: mind map */
.map{display:grid;grid-template-columns:minmax(150px,1fr) 60px minmax(170px,1.1fr) 60px minmax(200px,1.3fr);align-items:center;row-gap:16px;min-width:680px}
.node{border:2px solid var(--fg);border-radius:4px;padding:12px 14px;font-weight:700;text-align:center;box-shadow:6px 6px 0 var(--fg);opacity:0;transform:scale(.9);transition:opacity .45s,transform .45s}
.node.show{opacity:1;transform:none}
.node.core{background:var(--core-soft);color:var(--fg);font:700 clamp(22px,2.6vw,30px)/1.05 var(--display);text-transform:uppercase;grid-row:1/4;grid-column:1}
.node.t{font:700 19px var(--display);letter-spacing:.04em;text-transform:uppercase}
.node.d{font-weight:500;font-size:14.5px;line-height:1.4}
.node b.uid{display:block;font:700 15px var(--mono);margin-top:4px}
.k-root{background:var(--root-soft)} .k-norm{background:var(--norm-soft)} .k-sys{background:var(--sys-soft)}
.wire{height:3px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .45s;position:relative}
.wire.show{transform:none}
.wire::after{content:"";position:absolute;right:-2px;top:-5px;border:6.5px solid transparent;border-left:9px solid var(--fg);border-right:0}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:17px}
.cmdbig{font:700 20px var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:var(--bg)}
.cmdbig .c{color:var(--no)} .cmdbig .p{color:var(--accent)}

/* scene 2: UID line */
.uidline{display:grid;grid-template-columns:1fr 3fr 3fr;gap:8px;min-width:620px}
.band{border:2px solid;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:230px}
.band h4{margin:0;font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em}
.band .range{font:700 15px var(--mono)}
.band.root{border-color:var(--root);background:var(--root-soft)} .band.root h4,.band.root .range{color:var(--root)}
.band.sys{border-color:var(--sys);background:var(--sys-soft)} .band.sys h4,.band.sys .range{color:var(--sys)}
.band.norm{border-color:var(--norm);background:var(--norm-soft)} .band.norm h4,.band.norm .range{color:var(--norm)}
.band .chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 12.5px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;animation:drop .45s both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.band.flash{outline:3px solid var(--accent);outline-offset:2px}
.feed{font:13.5px/1.7 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:3.6em;white-space:pre}
.feed .u{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:3px;padding:0 2px}

/* scene 3: files */
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.files{grid-template-columns:minmax(0,1fr)}}
.fcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .3s,background .3s}
.fcard.now{border-color:var(--accent);background:var(--accent-soft)}
.fcard .what{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .name{font:700 26px var(--display)}
.fcard .cmd{font:600 14px var(--mono)}
.fcard .cmd .p{color:var(--accent)}
.fcard .who{font-size:13px;color:var(--muted)}
.anat{display:flex;flex-direction:column;gap:10px}
.fields{display:flex;flex-wrap:nowrap;font:600 clamp(13px,1.8vw,18px) var(--mono);white-space:nowrap}
.fields span.f{padding:4px 3px;border-radius:4px;border:2px solid transparent;transition:background .3s,border-color .3s}
.fields span.f.hl{background:var(--accent-soft);border-color:var(--accent)}
.fields span.sep{color:var(--muted);padding:4px 0}
.fexplain{font-size:15px;min-height:2.6em}
.fexplain b{font-family:var(--mono)}

/* scene 4: home tree */
.tree{font:600 clamp(14px,1.9vw,18px)/2 var(--mono);display:flex;flex-direction:column}
.tree .row{display:flex;align-items:center;gap:10px;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
.tree .row.show{opacity:1;transform:none}
.tree .pre{color:var(--muted);white-space:pre}
.tag{font:600 12px var(--body);border-radius:999px;padding:1px 10px}
.tag.root{background:var(--root-soft);color:var(--root)} .tag.norm{background:var(--norm-soft);color:var(--norm)}
.walk{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.who-box{font:700 18px var(--mono);border:2px solid var(--line);border-radius:6px;padding:6px 12px;transition:border-color .3s}
.who-box.root{border-color:var(--root);color:var(--root)} .who-box.norm{border-color:var(--norm);color:var(--norm)}
.term{background:#300a24;color:#eeeeec;border-radius:8px;padding:12px 14px;font:15px/1.5 "Ubuntu Mono",var(--mono);min-height:84px;white-space:pre-wrap}
.term .pu{color:#8ae234;font-weight:700} .term .pp{color:#729fcf;font-weight:700}

/* scene 5: default group */
.dg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.dg{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.box h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font:600 13px var(--mono);display:flex;justify-content:space-between}
.box h3 span{font:500 12px var(--body);color:var(--muted)}
.lines{font:13px/1.8 var(--mono);padding:4px 0;overflow-x:auto}
.ln{padding:0 12px;white-space:pre}
.ln.add{background:var(--ok-soft);color:var(--ok);animation:drop .45s both}
.ln .hl{background:var(--norm-soft);color:var(--norm);border-radius:3px;padding:0 2px}

/* scene 6: quiz */
.q{display:flex;flex-direction:column;gap:14px}
.qcard{font:700 clamp(15px,2vw,20px) var(--mono);border:2px dashed var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.qcard .u{color:var(--accent)}
.answers{display:flex;flex-wrap:wrap;gap:10px}
.answers button{font-size:15px;padding:10px 16px;border-width:2px}
.answers .a-root{border-color:var(--root)} .answers .a-sys{border-color:var(--sys)} .answers .a-norm{border-color:var(--norm)}
.fb{font-weight:600;min-height:1.6em;padding:8px 12px;border-radius:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.no{background:var(--no-soft);color:var(--no)}
.score{font:600 13px var(--mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.in,.chip,.ln.add{animation:none}.node,.wire,.tree .row{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Users in Linux</h1>
    <p>The three kinds of user, how the UID tells them apart, and the files that store them. Use the buttons, the ← → keys, or Space to pause.</p>
  </header>
  <div class="controls">
    <button id="prev">← Back</button>
    <button id="pause" aria-pressed="false">❚❚ Pause</button>
    <button id="next" class="primary">Next →</button>
    <span class="counter" id="counter"></span>
    <div class="tabs" id="tabs"></div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<script>
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers=[],loops=[],paused=false;
const $=s=>document.querySelector(s);
const every=(fn,ms)=>{fn();loops.push({fn,ms});if(!reduce&&!paused)timers.push(setInterval(fn,ms));};
const stopIntervals=()=>{timers.forEach(clearInterval);timers=[];};
const clearTimers=()=>{stopIntervals();loops=[];};
function setPaused(v){paused=v;stopIntervals();
  if(!paused&&!reduce)loops.forEach(l=>timers.push(setInterval(l.fn,l.ms)));
  $("#pause").textContent=paused?"▶ Play":"❚❚ Pause";$("#pause").setAttribute("aria-pressed",String(paused));}
const head=(eb,t,lead)=>`<div class="in" style="--i:0"><div class="eyebrow">${eb}</div><h2>${t}</h2></div><p class="lead in" style="--i:1">${lead}</p>`;
const note=(t,i=6)=>`<div class="remember in" style="--i:${i}"><b>Remember</b>${t}</div>`;
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const kind=uid=>uid===0?"root":uid<1000?"sys":"norm";
const KIND={root:"Admin user (root)",sys:"System user",norm:"Normal user"};

/* sample /etc/passwd from an Ubuntu VM */
const PASSWD=[
 ["root",0,0,"root","/root","/bin/bash"],
 ["daemon",1,1,"daemon","/usr/sbin","/usr/sbin/nologin"],
 ["bin",2,2,"bin","/bin","/usr/sbin/nologin"],
 ["sys",3,3,"sys","/dev","/usr/sbin/nologin"],
 ["www-data",33,33,"www-data","/var/www","/usr/sbin/nologin"],
 ["syslog",104,111,"","/home/syslog","/usr/sbin/nologin"],
 ["ali",1001,1001,"","/home/ali","/bin/bash"],
 ["hamad",1002,1002,"","/home/hamad","/bin/bash"],
 ["ahmed",1003,1003,"","/home/ahmed","/bin/bash"]
];
const pline=u=>u.join(":").replace(/^([^:]+):/,"$1:x:");

const scenes=[
/* 1 mind map */
{tab:"3 types of user",render(){
  const D=[["root","Admin user","root user, full privilege","UID is 0"],["norm","Normal user","Regular users, like ali, hamad","UID starts from 1000"],["sys","System users","Service users, like daemon, www-data","UID between 1 and 999"]];
  let g=`<div class="node core" data-s="0">Users in<br>Linux</div>`;
  D.forEach((d,r)=>{g+=`<div class="wire" data-s="${1+r*3}" style="grid-row:${r+1};grid-column:2"></div>
    <div class="node t k-${d[0]}" data-s="${2+r*3}" style="grid-row:${r+1};grid-column:3">${d[1]}</div>
    <div class="wire" data-s="${2+r*3}" style="grid-row:${r+1};grid-column:4"></div>
    <div class="node d k-${d[0]}" data-s="${3+r*3}" style="grid-row:${r+1};grid-column:5">${d[2]}<b class="uid">${d[3]}</b></div>`;});
  return {html:head("Part 1","There are three kinds of user in Linux","Linux tells them apart by one number: the <b>UID</b> (user ID). Watch the map build.")+
    `<div class="scroll in" style="--i:2"><div class="map" id="map">${g}</div></div>
     <div class="foot in" style="--i:3">All of these accounts are stored in one file, <b>passwd</b>. To check, type <span class="cmdbig"><span class="c">cat</span> <span class="p">/etc/passwd</span></span></div>`+
    note("root = UID 0 · system users = 1 to 999 · normal users = 1000 and up. Ubuntu keeps 1–99 for fixed system accounts and 100–999 for services added later.",4),
   start(){let n=0;const max=10;
     every(()=>{document.querySelectorAll("#map [data-s]").forEach(e=>e.classList.toggle("show",+e.dataset.s<=n));n=n>=max+3?0:n+1;},700);}};
}},
/* 2 sort by UID */
{tab:"Sort by UID",render(){
  return {html:head("Part 2","Read the UID, find the type","Each line of <code>/etc/passwd</code> is one user. The 3rd field is the UID. Watch each user drop into the right group.")+
    `<div class="feed in" style="--i:2" id="feed"> </div>
     <div class="scroll in" style="--i:3"><div class="uidline">
       <div class="band root" id="b-root"><h4>Admin</h4><span class="range">UID 0</span><div class="chips"></div></div>
       <div class="band sys" id="b-sys"><h4>System users</h4><span class="range">UID 1 – 999</span><div class="chips"></div></div>
       <div class="band norm" id="b-norm"><h4>Normal users</h4><span class="range">UID 1000 +</span><div class="chips"></div></div>
     </div></div>`+
    note("System users usually have the shell /usr/sbin/nologin, so nobody can log in as them. They exist to run services.",4),
   start(){let i=0;
     every(()=>{if(i===0)document.querySelectorAll(".band .chips").forEach(c=>c.innerHTML="");
       if(i>=PASSWD.length){i=0;return;}
       const u=PASSWD[i],k=kind(u[1]),parts=pline(u).split(":");parts[2]=`<span class="u">${parts[2]}</span>`;
       $("#feed").innerHTML=`$ cat /etc/passwd | line ${i+1}\n${parts.map((p,j)=>j===2?p:esc(p)).join(":")}`;
       document.querySelectorAll(".band").forEach(b=>b.classList.remove("flash"));
       const b=$("#b-"+k);b.classList.add("flash");
       b.querySelector(".chips").insertAdjacentHTML("beforeend",`<span class="chip">${u[0]} · ${u[1]}</span>`);i++;},1500);}};
}},
/* 3 important files */
{tab:"Important files",render(){
  const F=[["User account details","passwd","/etc/passwd","Anyone can read it",["ali","x","1001","1001","","/home/ali","/bin/bash"],
    ["username","x = password is kept in /etc/shadow","UID (user ID)","GID (the user's default group)","comment (full name, often empty)","home directory","login shell"]],
   ["Encrypted password information","shadow","/etc/shadow","Only root can read it: use sudo",["ali","$y$j9T$Lm7…a0Z","20387","0","99999","7","",""],
    ["username","encrypted password (! = no password set)","date of last change (days since 1 Jan 1970)","min days between changes","max days before it must change","warning days before expiry","",""]],
   ["Group details","group","/etc/group","Anyone can read it",["team","x","1003","alice,bob"],
    ["group name","x = group password not used","GID (group ID)","members (extra users in this group)"]]];
  return {html:head("Part 3","Three files to remember","All three live in <code>/etc</code> and are plain text, so <code>cat</code> shows them. The highlight walks through each field of one sample line.")+
    `<div class="files">${F.map((f,i)=>`<div class="fcard in" style="--i:${i+2}" data-f="${i}"><span class="what">${f[0]}</span><span class="name">${f[1]}</span>
      <span class="cmd"><span class="p">$</span> ${f[1]==="shadow"?"sudo ":""}cat ${f[2]}</span><span class="who">${f[3]}</span></div>`).join("")}</div>
     <div class="anat in" style="--i:5"><div class="scroll"><div class="fields" id="fl"></div></div><div class="fexplain" id="fx"></div></div>`+
    note("passwd → user details · shadow → encrypted passwords · group → group details.",6),
   start(){let f=0,k=-1;
     const draw=()=>{const [,,path,,vals,ex]=F[f];
       document.querySelectorAll(".fcard").forEach(c=>c.classList.toggle("now",+c.dataset.f===f));
       $("#fl").innerHTML=`<span class="sep" style="margin-right:8px">${path}</span>`+vals.map((v,j)=>`<span class="f ${j===k?"hl":""}">${esc(v)||"&nbsp;"}</span>`).join(`<span class="sep">:</span>`);
       $("#fx").innerHTML=k<0?"":`Field ${k+1}: <b>${esc(vals[k])||"(empty)"}</b> → ${ex[k]}`;};
     every(()=>{k++;let lim=F[f][5].filter(Boolean).length;if(k>=lim){k=-1;f=(f+1)%3;}draw();},1400);}};
}},
/* 4 home dirs */
{tab:"Home directories",render(){
  const R=[["/","",""],["├── root","root","Home of the root user"],["├── home","",""],["│   ├── ali","norm","Home of ali"],["│   └── ahmed","norm","Home of ahmed"],["└── etc","",""],["    ├── passwd","",""],["    ├── shadow","",""],["    └── group","",""]];
  return {html:head("Part 4","Where each user's home directory is","Root is special: its home is <code>/root</code>. Every normal user gets a folder inside <code>/home</code> with their own name.")+
    `<div class="two" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start">
     <div class="tree in" style="--i:2" id="tree">${R.map((r,i)=>`<div class="row" data-r="${i}"><span class="pre">${r[0]}</span>${r[1]?`<span class="tag ${r[1]}">${r[2]}</span>`:""}</div>`).join("")}</div>
     <div class="in" style="--i:3;display:flex;flex-direction:column;gap:10px"><div class="walk">Logged in as <span class="who-box" id="who"></span></div>
       <div class="term" id="hterm"></div></div></div>`+
    note("Home of root = /root. Home of a normal user = /home/username, e.g. /home/ali, /home/ahmed.",4),
   start(){let n=0,w=0;const W=[["root","root","#","/root"],["ali","norm","$","/home/ali"],["ahmed","norm","$","/home/ahmed"]];
     every(()=>{document.querySelectorAll("#tree .row").forEach(r=>r.classList.toggle("show",+r.dataset.r<=n));
       if(n>=R.length-1){const [u,k,sym,h]=W[w];$("#who").textContent=u;$("#who").className="who-box "+k;
         $("#hterm").innerHTML=`<span class="pu">${u}@ubuntu</span>:<span class="pp">~</span>${sym} cd ~ ; pwd\n${h}`;
         document.querySelectorAll("#tree .row").forEach(r=>r.style.fontWeight="");
         const idx={root:1,ali:3,ahmed:4}[u];document.querySelector(`#tree .row[data-r="${idx}"] .pre`).style.color="var(--fg)";
         document.querySelectorAll("#tree .row .pre").forEach((p,i)=>{if(i!==idx)p.style.color="";});
         w=(w+1)%3;}
       else n++;},1000);}};
}},
/* 5 default group */
{tab:"Default group",render(){
  return {html:head("Part 5","Every user gets a default group","When you create a user, Linux also creates a group with the <b>same name</b>. This is the user's default group. Files they create belong to that group.")+
    `<div class="term in" style="--i:2" id="dgt"></div>
     <div class="dg in" style="--i:3">
      <div class="box"><h3>/etc/passwd <span>4th field = GID</span></h3><div class="lines" id="dgp"></div></div>
      <div class="box"><h3>/etc/group <span>name:x:GID:members</span></h3><div class="lines" id="dgg"></div></div></div>`+
    note("Each user has their own group, called the default group: ali → group ali, ahmed → group ahmed.",4),
   start(){const users=[["ali",1001],["ahmed",1002]];let st=0;
     const base={p:["root:x:0:0:root:/root:/bin/bash"],g:["root:x:0:"]};
     every(()=>{const made=users.slice(0,st);
       $("#dgp").innerHTML=base.p.map(l=>`<div class="ln">${l}</div>`).join("")+made.map(([u,id],i)=>`<div class="ln ${i===st-1?"add":""}">${u}:x:${id}:<span class="hl">${id}</span>::/home/${u}:/bin/bash</div>`).join("");
       $("#dgg").innerHTML=base.g.map(l=>`<div class="ln">${l}</div>`).join("")+made.map(([u,id],i)=>`<div class="ln ${i===st-1?"add":""}"><span class="hl">${u}:x:${id}</span>:</div>`).join("");
       $("#dgt").innerHTML=made.map(([u])=>`<span class="pu">jd@ubuntu</span>:<span class="pp">~</span>$ sudo useradd -m ${u}\n`).join("")+
         (st===users.length?`<span class="pu">jd@ubuntu</span>:<span class="pp">~</span>$ id ali\nuid=1001(ali) gid=1001(ali) groups=1001(ali)`:`<span class="pu">jd@ubuntu</span>:<span class="pp">~</span>$ `);
       st=st>=users.length?0:st+1;},2200);}};
}},
/* 6 quiz */
{tab:"Quick quiz",render(){
  return {html:head("Part 6","Quick check: what kind of user is this?","Read the UID (3rd field) and choose the type. A new line appears after each answer.")+
    `<div class="q in" style="--i:2"><div class="qcard" id="qc"></div>
     <div class="answers"><button class="a-root" data-k="root">Admin (root)</button><button class="a-sys" data-k="sys">System user</button><button class="a-norm" data-k="norm">Normal user</button></div>
     <div class="fb" id="fb" aria-live="polite"></div><div class="score" id="sc"></div></div>`+
    note("Look only at the UID: 0 → root, 1–999 → system, 1000+ → normal.",3),
   start(){const pool=[...PASSWD,["lp",7,7,"lp","/var/spool/lpd","/usr/sbin/nologin"],["mohammed",1004,1004,"","/home/mohammed","/bin/bash"],["sshd",109,65534,"","/run/sshd","/usr/sbin/nologin"],["fatima",1005,1005,"","/home/fatima","/bin/bash"]];
     let order=pool.map((_,i)=>i).sort(()=>Math.random()-.5),q=0,right=0,done=0,locked=false;
     const show=()=>{const u=pool[order[q%pool.length]],p=pline(u).split(":");p[2]=`<span class="u">${p[2]}</span>`;
       $("#qc").innerHTML=p.map((x,j)=>j===2?x:esc(x)).join(":");$("#fb").className="fb";$("#fb").textContent="";locked=false;};
     show();$("#sc").textContent="Score: 0 / 0";
     document.querySelector(".answers").onclick=e=>{const b=e.target.closest("button");if(!b||locked)return;locked=true;
       const u=pool[order[q%pool.length]],k=kind(u[1]),ok=b.dataset.k===k;done++;if(ok)right++;
       $("#fb").className="fb "+(ok?"ok":"no");
       $("#fb").textContent=(ok?"✓ Correct. ":"✗ Not quite. ")+`${u[0]} has UID ${u[1]}, so it is a ${KIND[k].toLowerCase()}.`;
       $("#sc").textContent=`Score: ${right} / ${done}`;q++;setTimeout(show,1800);};}};
}}
];

let cur=0;
function go(i){
  clearTimers();cur=Math.max(0,Math.min(scenes.length-1,i));
  const s=scenes[cur].render();$("#stage").innerHTML=s.html;if(s.start)s.start();
  if(reduce)document.querySelectorAll(".node,.wire,.tree .row").forEach(e=>e.classList.add("show"));
  $("#counter").textContent=`${cur+1} / ${scenes.length}`;
  $("#prev").disabled=cur===0;$("#next").disabled=cur===scenes.length-1;
  $("#pause").disabled=reduce||cur===scenes.length-1;
  $("#tabs").innerHTML=scenes.map((x,k)=>`<button class="tab ${k===cur?"now":""}" data-i="${k}">${k+1}. ${x.tab}</button>`).join("");
}
$("#pause").onclick=()=>setPaused(!paused);
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(b)go(+b.dataset.i);};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);
  if(e.key===" "&&e.target===document.body){e.preventDefault();if(!$("#pause").disabled)setPaused(!paused);}});
go(0);
</script>
